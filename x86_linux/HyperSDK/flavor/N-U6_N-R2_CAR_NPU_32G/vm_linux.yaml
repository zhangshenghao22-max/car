name: "linux"

role: 
  work_type: ["NVM"]
  start_type: LBVM

cpu:
  - name: "vcpu@0"
    type: "virt_cpu"
    args:
      - "pcpu=string,cpu@0"
      - "vm_cpu_idx=32u,0x0"

  - name: "vcpu@1"
    type: "virt_cpu"
    args:
      - "pcpu=string,cpu@1"
      - "vm_cpu_idx=32u,0x1"

  - name: "vcpu@2"
