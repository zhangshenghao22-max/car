fpo:
  - name: "pcie_host@8d0000000"
    type: "emu_pcie_host_generic"
    mem: "0x8d0000000,0x10000000"
    int: 
      - int_attr: [0x00,0x3a,0x04]
        parent: "pintc@0"
      - int_attr: [0x00,0x3b,0x04]
      - int_attr: [0x00,0x3c,0x04]
      - int_attr: [0x00,0x3d,0x04]
    args: 
      - "bus_range=8u,0xFF,0xFF"
      - "range=64u,0x03000000,0x8f0000000,0x8f0000000,0x100000"
      - "vendor_id=16u,0x1b36"
      - "device_id=16u,0x0008"
      - "legacy_irq=bool,true"
      - "pseudo=bool,true"

  # - name: "pcie_ivshmem@1"
  #   type: "emu_pcie_dev_ivshmem"
  #   args: 
  #     - "host=string,pcie_host@4d0000000"
  #     - "pcie_type=string,normal"
  #     - "pcie_permit=32u,0xFFFFFFFF"
  #     - "bdf=16u,0xff20"
  #     - "vendor_id=16u,0x1af4"
  #     - "device_id=16u,0x1110"
  #     - "class=16u,0x0500"
  #     - "sub_vendor_id=16u,0x1af4"
  #     - "sub_device_id=16u,0x1110"
  #     - "msix_vector_nr=16u,0x10"
  #     - "using_64bit=bool,true"
  #     - "legacy_irq=bool,true"
  #     - "pseudo=bool,true"
  #     - "backend=string,shm@1"
  
  - name: "pcie_ivshmem@nic-back0"
    type: "emu_pcie_dev_ivshmem"
    args:
      - "host=string,pcie_host@8d0000000"
      - "pcie_type=string,normal"
      - "pcie_permit=32u,0xFFFFFFFF"
      - "bdf=16u,0xff28"
      - "vendor_id=16u,0x1af4"
      - "device_id=16u,0x1110"
      - "class=16u,0x0200"
      - "sub_vendor_id=16u,0x1af4"
      - "sub_device_id=16u,0x1110"
      - "msix_vector_nr=16u,0x10"
      - "using_64bit=bool,true"
      - "legacy_irq=bool,true"
      - "intx_pin=8u,0x01"
      - "pseudo=bool,true"
      - "backend=string,shm@2"
      - "shm_gpa=64u,0xa00000"
      - "shm_flag=string,WR|RD|EXE|WB"

  - name: "pwr-button1"
    type: "emu_ettus_e3x0_button"
    int: 
      - int_attr: [0x00,0x00,0x01]
        parent: "pintc@0"
      - int_attr: [0x00,0x01,0x01]

bpo: none

bootcfg:
  boot_type: FDT
  kernel:
    name: "Kernel.bin"
    load_addr: 0xce00000
    exec_addr: 0x0

  fdt:
    name: "kernel.dtb"
    load_addr: 0x16b00000
    exec_addr: 0x0

  initrd: 
    name: "Initrd.img"
    load_addr: 0x20000000
    exec_addr: 0x0

