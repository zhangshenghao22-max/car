  - name: "vcpu@5"
    type: "virt_cpu"
    args:
      - "pcpu=string,cpu@5"
      - "vm_cpu_idx=32u,0x5"

mem:
  - pool: none
    #size: [main length(unit:M),second length(unit:K)],second length 4K aligned
    #size: [main length(unit:G),second length(unit:M)]
    #size: main length(unit:G/M)
    size: 448
    #gpa:[high 32bit addr,low 32bit addr],addr 4K aligned
    gpa: 0xca00000
    hpa: 0xca00000
    attr: ["RWX","WB","SHARE"]
  - pool: none
    size: [2G,256]
    gpa: 0x50000000
    hpa: 0x50000000
    attr: ["RWX","WB","SHARE"]
  - pool: none
    size: [11G,960]
    gpa: 0x100000000
    hpa: 0x100000000
    attr: ["RWX","WB","SHARE"]
  - pool: none
    size: 16G
    gpa: 0x400000000
    hpa: 0x400000000
    attr: ["RWX","WB","SHARE"]

