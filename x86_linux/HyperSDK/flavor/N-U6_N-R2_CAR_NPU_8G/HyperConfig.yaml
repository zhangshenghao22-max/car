    # - name: "memory1"
    #   addr: 0x200000
    #   length: 0xefe00000
    #   attr: 0x0
    # - name: "memory2"
    #   addr: 0x100000000
    #   length: 0x2fc000000
    #   attr: 0x0
    # - name: "memory3"
    #   addr: 0x3fc500000
    #   length: 0x3a00000
    #   attr: 0x0

    - name: "memory1"
      addr: 0x200000
      length: 0xefe00000
      attr: 0x0
    - name: "memory2"
      addr: 0x100000000
      length: 0x100000000
      attr: 0x0

  dev:
