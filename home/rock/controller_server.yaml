/controller_server:
  ros__parameters:
    FollowPath:
      BaseObstacle:
        class: BaseObstacle
        scale: 0.04
        sum_scores: false
      GoalAlign:
        aggregation_type: last
        class: GoalAlign
        forward_point_distance: 0.1
        scale: 24.0
      GoalDist:
        aggregation_type: last
        class: GoalDist
        scale: 20.0
      Oscillation:
        class: Oscillation
        oscillation_reset_angle: 1.57
        oscillation_reset_dist: 0.1
        oscillation_reset_time: -1.0
        scale: 1.0
        x_only_threshold: 0.05
      PathAlign:
        aggregation_type: last
        class: PathAlign
        forward_point_distance: 0.35
        scale: 48.0
      PathDist:
        aggregation_type: last
        class: PathDist
        scale: 32.0
      RotateToGoal:
        class: RotateToGoal
        lookahead_time: -1.0
        scale: 64.0
        slowing_factor: 5.0
      acc_lim_theta: 0.35
      acc_lim_x: 0.5
      acc_lim_y: 0.0
      angular_granularity: 0.025
      critics:
      - RotateToGoal
      - Oscillation
      - BaseObstacle
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist
      debug_trajectory_details: false
      decel_lim_theta: -0.5
      decel_lim_x: -0.5
      decel_lim_y: -0.0
      default_critic_namespaces: null
      discretize_by_time: false
      include_last_point: true
      linear_granularity: 0.05
      marker_lifetime: 0.1
      max_speed_xy: 0.3
      max_vel_theta: 0.28
      max_vel_x: 0.3
      max_vel_y: 0.0
      min_speed_theta: 0.05
      min_speed_xy: 0.05
      min_vel_x: -0.3
      min_vel_y: 0.0
      plugin: dwb_core::DWBLocalPlanner
      prune_distance: 1.0
      prune_plan: true
      publish_cost_grid_pc: false
      publish_evaluation: true
      publish_global_plan: true
      publish_local_plan: true
      publish_trajectories: true
      publish_transformed_plan: true
      short_circuit_trajectory_evaluation: true
      shorten_transformed_plan: true
      sim_time: 1.5
      time_granularity: 0.5
      trajectory_generator_name: dwb_plugins::StandardTrajectoryGenerator
      trans_stopped_velocity: 0.05
      transform_tolerance: 0.3
      vtheta_samples: 7
      vx_samples: 5
      vy_samples: 1
      xy_goal_tolerance: 0.15
    controller_frequency: 3.0
    controller_plugins:
    - FollowPath
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.1
    goal_checker_plugin: goal_checker
    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    odom_topic: odom
    progress_checker:
      movement_time_allowance: 60.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.3
    progress_checker_plugin: progress_checker
    use_sim_time: false
