# ============================================================================
# Nav2参数配置文件 / Nav2 Parameters Configuration File
# ============================================================================
#
# 注意：速度限制参数现在统一管理在：
# Note: Velocity limits are now centrally managed in:
#   rt_robot_nav2/config/velocity_limits.yaml
#
# 修改速度限制时，请同时修改两个文件：
# When modifying velocity limits, update BOTH files:
#   1. rt_robot_nav2/config/velocity_limits.yaml (主要 / primary)
#   2. rt_robot_nav2/param/rt_robot_params.yaml (Nav2控制器 / Nav2 controller)
#
# 统一配置确保：
# Unified configuration ensures:
#   - 键盘遥控速度限制一致
#   - Nav2导航速度限制一致
#   - 避免配置不一致导致的问题
#
# ============================================================================

amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.9
    alpha2: 0.1
    alpha3: 0.05
    alpha4: 0.01
    alpha5: 0.04
    base_frame_id: "base_footprint"  # Standard ROS convention: base_footprint at ground level
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"  # Changed from odom_combined to odom
    pf_err: 0.02
    pf_z: 0.85
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 2
    robot_model_type: "omnidirectional"  # Changed to omnidirectional for mecanum wheel robot
    save_pose_rate: 0.5  # Rate at which to save the pose (Hz)
    # Note: AMCL publishes TF at this rate, but may need laser scan to start publishing
    sigma_hit: 0.02
    tf_broadcast: true
    transform_tolerance: 0.8
    # Update thresholds: lower values make AMCL update more frequently
    # update_min_d: minimum distance (meters) robot must move before AMCL updates
    # update_min_a: minimum angle (radians) robot must rotate before AMCL updates
    # Reduced thresholds for more responsive localization (original: 0.2, 0.25)
    update_min_d: 0.025   # Reduced from 0.25 to 0.05m (5cm) for more frequent updates
    update_min_a: 0.06   # Reduced from 0.2 to 0.05rad (~2.9°) for more frequent updates
    z_hit: 0.7
    z_max: 0.001
    z_rand: 0.059
    z_short: 0.24
    scan_topic: /scan
    always_reset_initial_pose: false  # Set to false following mature project practices: initial pose is set via parameters only once at startup
    map_topic: /map
    # Initial Pose - should be set via /initialpose topic from map yaml (auto_initialpose.py)
    # Disable hardcoded initial pose to force use of /initialpose topic
    # This ensures AMCL uses the correct initial pose saved in map yaml
    set_initial_pose: false  # Set to false to use /initialpose topic instead of hardcoded values
    # Note: initial_pose parameters below are ignored when set_initial_pose: false
    # They are kept for backward compatibility but should not be used
    initial_pose.x: 0.0
    initial_pose.y: 0.0
    initial_pose.z: 0.0
    initial_pose.yaw: 0.0

amcl_map_client:
  ros__parameters:
    use_sim_time: False

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator:
  ros__parameters:
    default_bt_xml_filename: "navigate_w_replanning_time.xml"
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint  # Standard ROS convention: base_footprint at ground level
    odom_topic: /odom  # Changed from /odom_combined
    bt_loop_duration: 5  # 🔧 REDUCED: From 10 to 5 ms - faster tick, less CPU per tick
    default_server_timeout: 5000  # Milliseconds in Nav2 Foxy.
    # Add action server wait timeout to ensure servers are ready
    wait_for_service_timeout: 10.0  # Wait up to 10 seconds for action servers to be ready
    action_server_preserve_once_duration: 10.0  # Keep action server state for 10 seconds after completion
    action_server_timeout: 30.0  # 🔧 INCREASED: From 20 to 30 seconds
    # Additional parameters to fix "send_goal failed" issue in Nav2 Foxy
    goal_reached_tol: 0.25  # Distance tolerance for considering goal reached
    transform_timeout: 2.0  # Timeout for TF transforms (seconds)
    error_code_tol: 3  # 🔧 INCREASED: From 1 to 3 - more tolerant to transient errors
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    # Note: nav2_compute_path_through_poses_action_bt_node is not available in ROS2 Foxy
    # - nav2_compute_path_through_poses_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_distance_traveled_condition_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_goal_updater_node_bt_node
    # Note: nav2_navigate_through_poses_action_bt_node is not available in ROS2 Foxy
    # - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    # Note: nav2_remove_passed_goals_action_bt_node is not available in ROS2 Foxy
    # - nav2_remove_passed_goals_action_bt_node

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 3.0  # 🔧 EXTREME: From 5.0 to 3.0 Hz - LAST RESORT for weak hardware
    # Action server parameters to handle "send_goal_failed" issue
    action_server_report_period: 1.0  # How often to report action server status (seconds)
    action_server_result_timeout: 300.0  # How long to keep results (5 minutes)
    # Velocity thresholds: for considering the robot stopped
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    # Foxy board build accepts the singular goal checker parameter.
    goal_checker_plugin: "goal_checker"
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.08
      movement_time_allowance: 20.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.10
      stateful: True

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: False  # 🔧 DISABLED: Reduce logging overhead
      min_vel_x: 0.0    # Normal navigation rotates to face the path instead of reversing.
      max_vel_x: 0.3
      min_vel_y: 0.0   # Fixed right velocity (mecanum wheel, if needed change to -0.3)
      max_vel_y: 0.0    # Fixed left velocity (mecanum wheel, if needed change to 0.3)
      min_vel_theta: -0.28
      max_vel_theta: 0.28
      # Exclude the stationary trajectory while FollowPath has an active goal.
      # Otherwise PathAlign ties at large (>90 deg) heading errors and DWB
      # repeatedly selects zero velocity instead of a legal pivot.
      min_speed_xy: 0.05
      max_speed_xy: 0.3  # Maximum combined linear speed (LIMITED to 0.3 m/s for stability) - reduced from 0.4
      min_speed_theta: 0.05
      acc_lim_x: 0.5   # X direction acceleration limit (m/s²) - allow smooth transition to 0.1 m/s
      acc_lim_y: 0.0   # Y direction acceleration limit (m/s²) - allow smooth transition to 0.1 m/s
      acc_lim_theta: 0.35
      decel_lim_x: -0.5   # X direction deceleration limit (m/s²)
      decel_lim_y: -0.0   # Y direction deceleration limit (m/s²)
      decel_lim_theta: -0.50
      # Add intermediate linear and angular candidates so DWB is not limited to
      # full-speed arcs or a coarse +/-0.5 rad/s pivot.
      vx_samples: 7
      vy_samples: 1     # Minimal lateral sampling
      vtheta_samples: 11
      # At 0.20 rad/s, a 1 s rollout moves too little to cross a PathAlign
      # costmap cell, so the zero and correct pivot trajectories tie.
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.8
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.05  # Reduced to 0.05 for better stop detection (must be > min_vel_x threshold)
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      Oscillation.oscillation_reset_dist: 0.10
      Oscillation.oscillation_reset_angle: 1.57
      Oscillation.oscillation_reset_time: -1.0
      BaseObstacle.scale: 0.04
      PathAlign.scale: 48.0
      PathAlign.forward_point_distance: 0.35
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.10
      PathDist.scale: 32.0
      GoalDist.scale: 20.0
      RotateToGoal.scale: 64.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom  # Changed from odom_combined
      robot_base_frame: base_footprint  # Standard ROS convention: base_footprint at ground level
      use_sim_time: False
      rolling_window: true
      width: 3
      # Increase transform tolerance to handle TF timing issues
      transform_tolerance: 0.8
      height: 3
      resolution: 0.05
      footprint: "[[0.14, 0.129], [0.14, -0.129], [-0.14, -0.129], [-0.14, 0.129]]"
      footprint_padding: 0.0
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 12.0
        inflation_radius: 0.19
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: True
        observation_sources: scan
        scan:
          topic: /scan_costmap
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: True
          # Foxy uses raytrace_range/obstacle_range.
          raytrace_range: 10.0
          obstacle_range: 2.5
      # Note: local_costmap typically doesn't use static_layer (only obstacle_layer and inflation_layer)
      # static_layer is only used in global_costmap
      always_send_full_costmap: False
  local_costmap_client:
    ros__parameters:
      use_sim_time: False
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      # 🔧 REDUCED update_frequency to lower CPU load
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint  # Standard ROS convention: base_footprint at ground level
      use_sim_time: False
      footprint: "[[0.14, 0.129], [0.14, -0.129], [-0.14, -0.129], [-0.14, 0.129]]"
      footprint_padding: 0.0
      resolution: 0.05
      track_unknown_space: true
      # Increase transform tolerance to handle TF timing issues
      transform_tolerance: 0.8
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.19
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: True
        observation_sources: scan
        scan:
          topic: /scan_costmap
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: True
          # Foxy uses raytrace_range/obstacle_range.
          raytrace_range: 10.0
          obstacle_range: 2.5
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: False
  global_costmap_client:
    ros__parameters:
      use_sim_time: False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: False
    expected_planner_frequency: 2.0  # 🔧 EXTREME: From 5.0 to 2.0 Hz - LAST RESORT
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.10
      use_astar: false
      allow_unknown: true
      # Standardized transform tolerance for TF lookups
      transform_tolerance: 0.8

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

recoveries_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    recovery_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_recoveries/Spin"
    backup:
      plugin: "nav2_recoveries/BackUp"
    wait:
      plugin: "nav2_recoveries/Wait"
    global_frame: odom  # Changed from odom_combined
    robot_base_frame: base_footprint  # Standard ROS convention: base_footprint at ground level
    transform_tolerance: 0.1
    use_sim_time: False
    simulate_ahead_time: 2.0
    # Recovery action velocity limits: using fixed angular velocity (angular.z: ±0.4)
    max_rotational_vel: 0.4   # Fixed rotational velocity for recovery actions (rad/s) - matching navigation fixed speed
    min_rotational_vel: 0.4   # Fixed rotational velocity for recovery actions (rad/s) - matching navigation fixed speed
    rotational_acc_lim: 0.5   # Rotational acceleration limit for recovery actions (rad/s²) - matching navigation acceleration

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    stop_on_failure: false
    loop_rate: 20
    stop_on_failure: false

waypoint_follower_rclcpp_node:
  ros__parameters:
    use_sim_time: False
