ekf_filter_node:
  ros__parameters:
    use_sim_time: false
    frequency: 10.0
    sensor_timeout: 0.1
    two_d_mode: true
    # Publish odom -> base_footprint slightly ahead for Foxy AMCL lookups.
    transform_time_offset: 0.1
    transform_timeout: 0.1
    print_diagnostics: false
    publish_tf: true
    publish_acceleration: false
    reset_on_time_jump: true

    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: /odom_raw
    odom0_config: [true, true, false,
                   false, false, true,
                   true, true, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false
    odom0_pose_rejection_threshold: 8.0
    odom0_twist_rejection_threshold: 3.0

    # Fuse calibrated yaw rate only; wheel odometry owns planar pose and velocity.
    imu0: /imu/data_calibrated
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 20
    imu0_nodelay: true
    imu0_differential: false
    imu0_relative: false
    imu0_twist_rejection_threshold: 1.0
    imu0_remove_gravitational_acceleration: true

    use_control: false
