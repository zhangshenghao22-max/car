profile_name: apriltag_continuous_partition_scan_v2

scan:
  waypoints:
    - name: top_approach
      capture: false
      s0_offset_pwm: 0
      duration_ms: 1600
      retracted_pose: [1640, 1500, 1500, 2350, 1500, 1500]
      extended_pose: [1640, 1592, 1552, 2150, 1500, 1500]
    - name: current_meter
      capture: true
      s0_offset_pwm: -20
      duration_ms: 700
      retracted_pose: [1640, 1500, 1500, 2350, 1500, 1500]
      extended_pose: [1640, 1592, 1552, 2150, 1500, 1500]
    - name: upper_status_lights
      capture: true
      s0_offset_pwm: 45
      duration_ms: 900
      retracted_pose: [1640, 1290, 1240, 2250, 1500, 1500]
      extended_pose: [1640, 1537, 1401, 2193, 1500, 1500]
  extension:
    disable_below_mm: 200.0
    full_at_mm: 220.0
    max_distance_spread_mm: 20.0
    max_forward_mm: 30.0
    direct_scan_scale: 1.0
  servo_limits:
    - [500, 2500]
    - [1000, 1600]
    - [900, 1600]
    - [2050, 2400]
    - [1500, 1500]
    - [1500, 1500]
  row_duration_ms: 1400
  home_duration_ms: 1800
  command_retain_timeout_s: 1.0
  command_retry_count: 3
  command_retry_backoff_s: 0.30
  settle_s: 0.60
  pose_test_hold_s: 2.0
  max_center_steps: 3
  s0_max_delta_pwm: 250
  horizontal_tolerance_ratio: 0.04
  s0_duration_per_pwm_ms: 4.0
  s0_min_duration_ms: 500
  s0_max_duration_ms: 1000

capture:
  backend: v4l2
  width: 3264
  height: 2448
  fps: 15
  startup_timeout_s: 8.0
  startup_attempts: 3
  startup_retry_backoff_s: 0.75
  read_timeout_s: 1.0
  warmup_frames: 5
  max_candidates: 10
  jpeg_quality: 95
  worker_jpeg_quality: 85
  max_retakes: 0

stream:
  width: 1280
  height: 960
  fps: 8.0
  jpeg_quality: 75
  rectify: true

observation:
  primary_duration_s: 2.0
  extension_duration_s: 0.5
  minimum_duration_s: 1.0
  max_camera_age_s: 1.0
  max_inference_start_age_s: 0.25
  max_detection_age_s: 1.75
  frame_wait_timeout_s: 1.5
  minimum_camera_fps: 4.0
  low_fps_failure_s: 3.0
  max_consecutive_frame_timeouts: 2
  max_consecutive_inference_timeouts: 3

recognition:
  worker_socket: runtime/recognition_worker/worker.sock
  models:
    - yolo_models/lightlabel_best.onnx
    - yolo_models/switch_yolo_best.onnx
    - yolo_models/meter_digit_unified_best.onnx
    - yolo_models/digits_best.onnx
  conf: 0.22
  switch_conf: 0.20
  digit_conf: 0.15
  iou: 0.45
  input_width: 640
  input_height: 480
  motion_detection_hz: 8.0
  max_inference_elapsed_s: 1.5
  meter_processing_timeout_s: 1.25
  current_meter_fast_alignment: true
  current_meter_fast_canonical_size: 640
  meter_parallel_workers: 2

quality:
  min_capture_score: 0.30
  meter_template_min: 0.55
  consensus_votes: 2
  voltage_consensus_votes: 3
  temperature_consensus_votes: 3
  meter_min_valid_results: 3
  meter_min_inliers: 2
  digit_min_valid_results: 3
  digit_min_winner_votes: 2
  digit_min_winner_ratio: 0.67
  light_min_valid_results: 3
  light_min_winner_votes: 2
  light_min_winner_ratio: 0.67
  switch_min_valid_results: 3
  switch_min_winner_votes: 2
  switch_min_winner_ratio: 0.67
  voltage_unstable_delta: 6.0
  current_unstable_delta: 0.05

best_effort:
  enabled: true
  voltage_fallback: 220.0
  current_fallback: 0.0
  status_light_fallbacks:
    upper_status_lights:green: "off"
    upper_status_lights:red: "off"
    lower_status_lights:green: "off"
    lower_status_lights:red: "off"

kinematics:
  l0_mm: 100.0
  l1_mm: 105.0
  l2_mm: 88.0
  tool_length_mm: 155.0
  home_pwm: [1600, 1500, 1500, 1500, 1500, 1500]
  direction: [-1, 1, 1, 1, 1, 1]
  pwm_per_deg: [7.4074074, 7.4074074, 7.4074074, 7.4074074, 7.4074074, 7.4074074]
  min_pwm: 500
  max_pwm: 2500
  min_deg: [-90, -90, -90, -90, -90, -90]
  max_deg: [135, 135, 135, 135, 135, 135]

output:
  upload_images: false
  status_file: runtime/cabinet_apriltag_inspection/status.json
  capture_dir: runtime/cabinet_apriltag_inspection/captures
  outbox_dir: runtime/cabinet_nav_takeover/outbox
